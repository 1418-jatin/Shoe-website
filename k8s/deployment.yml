apiVersion: apps/v1
kind: Deployment
metadata:
  name: jakey-shoes
  labels:
    app: jakey-shoes
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: jakey-shoes
  template:
    metadata:
      labels:
        app: jakey-shoes
    spec:
      containers:
        - name: jakey-shoes
          image: IMAGE_PLACEHOLDER        # replaced by Jenkins at deploy time
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
